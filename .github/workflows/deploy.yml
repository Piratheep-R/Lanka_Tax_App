name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          DEPLOY_TARGET: github-pages
          VITE_BASE_PATH: /Lanka_Tax_App/
        run: npm run build

      - name: Prepare static output directory
        run: |
          OUT_DIR=""
          if [ -d .output/public ]; then
            OUT_DIR=".output/public"
          elif [ -d dist ]; then
            OUT_DIR="dist"
          elif [ -d .output ]; then
            OUT_DIR=".output"
          else
            echo "Searching for build output..."
            OUT_DIR=$(find . -name "index.html" -o -name "_shell.html" | head -n 1 | xargs dirname)
          fi
          echo "Selected output directory: $OUT_DIR"
          touch "$OUT_DIR/.nojekyll"
          if [ -f "$OUT_DIR/_shell.html" ] && [ ! -f "$OUT_DIR/index.html" ]; then
            cp "$OUT_DIR/_shell.html" "$OUT_DIR/index.html"
          fi
          if [ -f "$OUT_DIR/index.html" ] && [ ! -f "$OUT_DIR/404.html" ]; then
            cp "$OUT_DIR/index.html" "$OUT_DIR/404.html"
          fi
          echo "OUT_DIR=$OUT_DIR" >> $GITHUB_ENV

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
